<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña - TRIKLES</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --tk-navy: #0a2540;
        --tk-navy-soft: #12375e;
        --tk-cream: #faf8f3;
        --tk-cream-deep: #f2ede0;
        --tk-gold: #c9a961;
        --tk-gold-soft: #d9bf83;
        --tk-ink: #1a1a1a;
        --tk-ink-soft: #4a4a4a;
        --tk-hairline: rgba(10,37,64,0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', -apple-system, sans-serif;
        background: var(--tk-cream);
        color: var(--tk-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .reset-card {
        background: white;
        border-radius: 16px;
        padding: 32px 28px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        text-align: center;
    }
    .reset-logo {
        margin-bottom: 20px;
    }
    .reset-logo img {
        max-width: 140px;
        max-height: 50px;
        object-fit: contain;
    }
    .reset-card h1 {
        font-family: 'Playfair Display', serif;
        font-size: 1.8em;
        color: var(--tk-navy);
        margin-bottom: 8px;
    }
    .reset-sub {
        color: var(--tk-ink-soft);
        font-size: 0.9em;
        margin-bottom: 24px;
    }
    .form-group {
        margin-bottom: 16px;
        text-align: left;
    }
    .form-group label {
        display: block;
        font-size: 0.85em;
        font-weight: 600;
        margin-bottom: 4px;
        color: var(--tk-ink);
    }
    .form-group input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 0.95em;
        font-family: inherit;
    }
    .form-group input:focus {
        outline: none;
        border-color: var(--tk-gold);
    }
    .reset-btn {
        width: 100%;
        padding: 14px;
        background: var(--tk-navy);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.2s;
    }
    .reset-btn:hover {
        background: var(--tk-navy-soft);
    }
    .reset-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
    .reset-error {
        color: #c62828;
        font-size: 0.85em;
        margin-top: 12px;
        display: none;
    }
    .reset-success {
        color: #2e7d32;
        background: #e8f5e9;
        padding: 12px 14px;
        border-radius: 6px;
        border-left: 4px solid #4caf50;
        font-size: 0.9em;
        margin-top: 12px;
        display: none;
    }
    .reset-footer {
        margin-top: 20px;
        font-size: 0.85em;
        color: var(--tk-ink-soft);
    }
    .reset-footer a {
        color: var(--tk-gold);
        text-decoration: none;
        font-weight: 600;
    }
    .reset-footer a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
<div class="reset-card">
    <div class="reset-logo">
        <img src="assets/logo-trikles.jpg" alt="TRIKLES" onerror="this.style.display='none';">
    </div>
    <h1>Nueva contraseña</h1>
    <div class="reset-sub">Ingresa tu nueva contraseña segura</div>
    <form id="resetForm" onsubmit="handleReset(event)">
        <div class="form-group">
            <label>Nueva contraseña</label>
            <input type="password" id="newPassword" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-group">
            <label>Confirmar contraseña</label>
            <input type="password" id="confirmPassword" required minlength="6" placeholder="Repite la contraseña">
        </div>
        <button class="reset-btn" type="submit" id="resetBtn">Restablecer contraseña</button>
        <div class="reset-error" id="resetError"></div>
        <div class="reset-success" id="resetSuccess">✓ Tu contraseña ha sido restablecida. <a href="index.html">Inicia sesión ahora</a></div>
    </form>
    <div class="reset-footer">
        <a href="index.html">Volver al inicio</a>
    </div>
</div>

<script>
async function handleReset(e) {
    e.preventDefault();
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('resetError');
    const successEl = document.getElementById('resetSuccess');
    const btn = document.getElementById('resetBtn');

    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (newPass !== confirmPass) {
        errorEl.textContent = 'Las contraseñas no coinciden.';
        errorEl.style.display = 'block';
        return;
    }

    if (newPass.length < 6) {
        errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        errorEl.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Restableciendo...';

    try {
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        if (!oobCode) {
            throw new Error('Código de restablecimiento inválido o expirado.');
        }

        await firebase.auth().confirmPasswordReset(oobCode, newPass);
        successEl.style.display = 'block';
        document.getElementById('resetForm').style.display = 'none';
    } catch (err) {
        console.error('Error resetting password:', err);
        errorEl.textContent = err.message || 'Error al restablecer la contraseña. Intenta de nuevo.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Restablecer contraseña';
    }
}

// Auto-focus on load
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('newPassword').focus();
});
</script>
</body>
</html></content>
