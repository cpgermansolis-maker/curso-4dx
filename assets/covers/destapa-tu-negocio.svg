<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Fondo marino profundo (paleta OAC) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2347"/>
      <stop offset="55%" stop-color="#0a1c3a"/>
      <stop offset="100%" stop-color="#060f24"/>
    </linearGradient>
    <!-- Resplandor central detrás del destape -->
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f5b800" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#2db5e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Viñeta -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <!-- Moneda dorada (brillante, para el chorro liberado) -->
    <radialGradient id="coinBright" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffe89a"/>
      <stop offset="45%" stop-color="#f5b800"/>
      <stop offset="100%" stop-color="#b07a06"/>
    </radialGradient>
    <!-- Moneda opaca (atorada abajo del freno) -->
    <radialGradient id="coinDull" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#c9a23d"/>
      <stop offset="55%" stop-color="#96741f"/>
      <stop offset="100%" stop-color="#5e470f"/>
    </radialGradient>
    <!-- Haz de luz del destape -->
    <linearGradient id="beam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f5b800" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffe89a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff7dd" stop-opacity="0"/>
    </linearGradient>
    <!-- Paredes del embudo -->
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13294e"/>
      <stop offset="100%" stop-color="#0a1830"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <!-- Grano sutil -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05" intercept="0"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- ===== FONDO ===== -->
  <rect width="300" height="400" fill="url(#bg)"/>
  <rect width="300" height="400" fill="url(#glow)"/>

  <!-- Patrón de puntos chevron (eco de la marca OAC), lados -->
  <g fill="#2db5e9" opacity="0.13">
    <circle cx="276" cy="96" r="1.6"/><circle cx="285" cy="104" r="2.2"/><circle cx="268" cy="106" r="1.2"/>
    <circle cx="278" cy="118" r="2.6"/><circle cx="290" cy="126" r="1.4"/><circle cx="269" cy="130" r="1.8"/>
    <circle cx="281" cy="142" r="2.0"/><circle cx="291" cy="152" r="1.2"/><circle cx="272" cy="154" r="2.4"/>
    <circle cx="283" cy="168" r="1.5"/><circle cx="275" cy="180" r="1.9"/><circle cx="289" cy="178" r="1.1"/>
    <circle cx="280" cy="196" r="2.3"/><circle cx="270" cy="206" r="1.3"/><circle cx="287" cy="212" r="1.7"/>
  </g>
  <g fill="#2db5e9" opacity="0.10">
    <circle cx="16" cy="120" r="1.8"/><circle cx="26" cy="130" r="1.2"/><circle cx="12" cy="142" r="2.4"/>
    <circle cx="22" cy="156" r="1.5"/><circle cx="30" cy="166" r="1.9"/><circle cx="14" cy="176" r="1.2"/>
    <circle cx="24" cy="190" r="2.1"/><circle cx="12" cy="204" r="1.4"/><circle cx="27" cy="214" r="1.6"/>
  </g>

  <!-- ===== ILUSTRACIÓN: EL DESTAPE ===== -->
  <!-- Resplandor difuso del haz -->
  <ellipse cx="150" cy="150" rx="34" ry="80" fill="#f5b800" opacity="0.28" filter="url(#soft)"/>

  <!-- Monedas ATORADAS bajo el freno (flujo congestionado) -->
  <g>
    <circle cx="60"  cy="246" r="9"   fill="url(#coinDull)"/>
    <circle cx="82"  cy="238" r="7.5" fill="url(#coinDull)"/>
    <circle cx="101" cy="247" r="8.5" fill="url(#coinDull)"/>
    <circle cx="121" cy="237" r="7"   fill="url(#coinDull)"/>
    <circle cx="140" cy="247" r="8"   fill="url(#coinDull)"/>
    <circle cx="159" cy="238" r="7.5" fill="url(#coinDull)"/>
    <circle cx="178" cy="247" r="8.5" fill="url(#coinDull)"/>
    <circle cx="198" cy="238" r="7"   fill="url(#coinDull)"/>
    <circle cx="218" cy="246" r="9"   fill="url(#coinDull)"/>
    <circle cx="240" cy="240" r="7"   fill="url(#coinDull)"/>
    <circle cx="93"  cy="225" r="6.5" fill="url(#coinDull)"/>
    <circle cx="112" cy="219" r="7"   fill="url(#coinDull)"/>
    <circle cx="131" cy="226" r="6"   fill="url(#coinDull)"/>
    <circle cx="150" cy="218" r="7.5" fill="url(#coinDull)"/>
    <circle cx="169" cy="226" r="6.5" fill="url(#coinDull)"/>
    <circle cx="188" cy="219" r="7"   fill="url(#coinDull)"/>
    <circle cx="207" cy="226" r="6"   fill="url(#coinDull)"/>
    <circle cx="124" cy="206" r="5.5" fill="url(#coinDull)"/>
    <circle cx="142" cy="200" r="6"   fill="url(#coinDull)"/>
    <circle cx="160" cy="202" r="5.5" fill="url(#coinDull)"/>
    <circle cx="177" cy="207" r="5"   fill="url(#coinDull)"/>
    <circle cx="150" cy="186" r="5"   fill="url(#coinDull)"/>
  </g>

  <!-- Paredes del freno (embudo invertido: angosto arriba) -->
  <path d="M -10,148 L 133,148 L 133,176 C 96,206 40,232 -10,256 Z" fill="url(#wall)"/>
  <path d="M 310,148 L 167,148 L 167,176 C 204,206 260,232 310,256 Z" fill="url(#wall)"/>
  <!-- Filo iluminado de las paredes -->
  <path d="M 133,148 L 133,176 C 96,206 40,232 -10,256" fill="none" stroke="#2db5e9" stroke-width="1.2" opacity="0.55"/>
  <path d="M 167,148 L 167,176 C 204,206 260,232 310,256" fill="none" stroke="#2db5e9" stroke-width="1.2" opacity="0.55"/>
  <path d="M -10,148 L 133,148" fill="none" stroke="#3d5d92" stroke-width="1" opacity="0.6"/>
  <path d="M 167,148 L 310,148" fill="none" stroke="#3d5d92" stroke-width="1" opacity="0.6"/>

  <!-- Haz que atraviesa el cuello -->
  <rect x="139" y="64" width="22" height="136" fill="url(#beam)"/>

  <!-- Anillo del destape (el freno rompiéndose) -->
  <circle cx="150" cy="160" r="17" fill="none" stroke="#ffe89a" stroke-width="2.4" opacity="0.95"/>
  <circle cx="150" cy="160" r="23" fill="none" stroke="#f5b800" stroke-width="1" opacity="0.4"/>
  <!-- Chispas radiales del anillo -->
  <g stroke="#ffd968" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <line x1="124" y1="146" x2="116" y2="141"/>
    <line x1="176" y1="146" x2="184" y2="141"/>
    <line x1="122" y1="170" x2="113" y2="173"/>
    <line x1="178" y1="170" x2="187" y2="173"/>
    <line x1="133" y1="133" x2="128" y2="126"/>
    <line x1="167" y1="133" x2="172" y2="126"/>
  </g>

  <!-- Monedas LIBERADAS (abanico ascendente con estelas) -->
  <g stroke="#f5b800" stroke-width="1.1" stroke-linecap="round" opacity="0.45">
    <line x1="150" y1="148" x2="150" y2="118"/>
    <line x1="138" y1="132" x2="128" y2="108"/>
    <line x1="162" y1="132" x2="172" y2="108"/>
    <line x1="128" y1="118" x2="112" y2="98"/>
    <line x1="172" y1="118" x2="188" y2="98"/>
    <line x1="146" y1="112" x2="143" y2="88"/>
    <line x1="156" y1="112" x2="160" y2="88"/>
  </g>
  <g>
    <circle cx="150" cy="106" r="7.5" fill="url(#coinBright)"/>
    <circle cx="124" cy="100" r="6"   fill="url(#coinBright)"/>
    <circle cx="177" cy="99"  r="6.5" fill="url(#coinBright)"/>
    <circle cx="104" cy="86"  r="5"   fill="url(#coinBright)"/>
    <circle cx="196" cy="85"  r="5.5" fill="url(#coinBright)"/>
    <circle cx="141" cy="79"  r="5.5" fill="url(#coinBright)"/>
    <circle cx="163" cy="76"  r="5"   fill="url(#coinBright)"/>
    <circle cx="86"  cy="72" r="3.8" fill="url(#coinBright)"/>
    <circle cx="214" cy="70"  r="4"   fill="url(#coinBright)"/>
    <circle cx="151" cy="62"  r="4"   fill="url(#coinBright)"/>
    <circle cx="120" cy="65"  r="3.5" fill="url(#coinBright)"/>
    <circle cx="184" cy="62"  r="3.5" fill="url(#coinBright)"/>
  </g>
  <!-- Brillos de las monedas -->
  <g fill="#fff7dd" opacity="0.85">
    <circle cx="147.5" cy="103" r="2"/>
    <circle cx="122" cy="98" r="1.6"/>
    <circle cx="175" cy="97" r="1.7"/>
    <circle cx="139.5" cy="77.5" r="1.5"/>
  </g>
  <!-- Destellos de 4 puntas -->
  <g fill="#ffffff">
    <path d="M 95,108 l 1.4,4 4,1.4 -4,1.4 -1.4,4 -1.4,-4 -4,-1.4 4,-1.4 Z" opacity="0.9"/>
    <path d="M 205,112 l 1.2,3.4 3.4,1.2 -3.4,1.2 -1.2,3.4 -1.2,-3.4 -3.4,-1.2 3.4,-1.2 Z" opacity="0.8"/>
    <path d="M 168,55 l 1,2.8 2.8,1 -2.8,1 -1,2.8 -1,-2.8 -2.8,-1 2.8,-1 Z" opacity="0.85"/>
  </g>

  <!-- ===== HEADER: LOGO OAC (vector) ===== -->
  <g transform="translate(20,18)">
    <!-- O -->
    <circle cx="14" cy="15" r="14" fill="#2db5e9"/>
    <!-- A (montaña) -->
    <path d="M 19,29 L 32.2,3 Q 33.5,0.8 34.8,3 L 48,29 Z" fill="#d9dcdf" opacity="0.88"/>
    <!-- C (media luna con borde plano) -->
    <path d="M 63,1 A 14,14 0 1 0 63,29 Z" fill="#ffffff" opacity="0.93"/>
    <!-- Leyenda -->
    <text x="74" y="9"  font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="6.4" fill="#f2f7fc" letter-spacing="0.7">ORGANIZACIÓN DE APOYO</text>
    <text x="74" y="18" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="6.4" fill="#f2f7fc" letter-spacing="0.7">PARA EL CRECIMIENTO</text>
    <text x="74" y="27" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="6.4" fill="#f2f7fc" letter-spacing="0.7">DE LAS MIPYMES</text>
    <text x="74" y="38.5" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="6.8" fill="#eef5fe" letter-spacing="2.2" opacity="1">&#215; TRIKLES</text>
  </g>

  <!-- ===== TITULAR ===== -->
  <text x="150" y="298" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="41" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DESTAPA</text>
  <text x="150" y="326" dx="-3" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="22" fill="#ffd968" text-anchor="middle" letter-spacing="6">TU NEGOCIO</text>
  <text x="150" y="346" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="400" font-size="7.6" fill="#b9c8de" text-anchor="middle" letter-spacing="0.4">Encuentra y rompe el freno que limita tus utilidades</text>

  <!-- Chips del método -->
  <g font-family="'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="9" text-anchor="middle">
    <g fill="none" stroke="#f5b800" stroke-width="0.8" opacity="0.75">
      <rect x="91"  y="358" width="18" height="17" rx="4"/>
      <rect x="114" y="358" width="18" height="17" rx="4"/>
      <rect x="137" y="358" width="18" height="17" rx="4"/>
      <rect x="160" y="358" width="18" height="17" rx="4"/>
      <rect x="183" y="358" width="18" height="17" rx="4"/>
    </g>
    <g fill="#ffd968">
      <text x="100" y="370.5">F</text>
      <text x="123" y="370.5">L</text>
      <text x="146" y="370.5">U</text>
      <text x="169" y="370.5">I</text>
      <text x="192" y="370.5">R</text>
    </g>
  </g>
  <text x="150" y="388" dx="-1.6" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="6.6" fill="#7e93b5" text-anchor="middle" letter-spacing="3.2">MÉTODO FLUIR</text>

  <!-- Viñeta + grano -->
  <rect width="300" height="400" fill="url(#vignette)"/>
  <rect width="300" height="400" fill="#888888" filter="url(#grain)" opacity="0.5"/>
</svg>
