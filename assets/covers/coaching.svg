<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4d5c"/>
      <stop offset="100%" stop-color="#082530"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>

  <!-- HEADER BAR -->
  <text x="20" y="36" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="2">TR<tspan fill="#ff8f00">I</tspan>KLES</text>
  <text x="280" y="36" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="9" fill="#d4af37" letter-spacing="2.5" text-anchor="end">CURSO PREMIUM</text>
  <line x1="20" y1="48" x2="280" y2="48" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>

  <!-- AUTOR -->
  <text x="150" y="170" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="400" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="3.5" opacity="0.85">SIR JOHN</text>
  <text x="150" y="221" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="46" fill="#d4af37" text-anchor="middle" letter-spacing="-2">WHITMORE</text>

  <!-- DIVISOR -->
  <line x1="80" y1="247" x2="220" y2="247" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>

  <!-- GLIFO DECORATIVO -->
  <text x="150" y="380" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="130" fill="#d4af37" text-anchor="middle" opacity="0.08">✓</text>
</svg>
