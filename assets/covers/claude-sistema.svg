<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0033"/>
      <stop offset="60%" stop-color="#1a0050"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b00d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7b00d4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>

  <!-- FONDO DECORATIVO — círculos de luz -->
  <circle cx="150" cy="160" r="130" fill="#7b00d4" opacity="0.06"/>
  <circle cx="150" cy="160" r="90" fill="#a855f7" opacity="0.05"/>

  <!-- LÍNEA GLOW CENTRAL -->
  <rect x="20" y="198" width="260" height="1" fill="url(#glow)"/>

  <!-- HEADER BAR -->
  <text x="20" y="36" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="13" fill="#a855f7" letter-spacing="2">TRIKLES</text>
  <text x="280" y="36" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="9" fill="#a855f7" letter-spacing="2.5" text-anchor="end">CURSO VIP</text>
  <line x1="20" y1="48" x2="280" y2="48" stroke="#7b00d4" stroke-width="0.6" opacity="0.8"/>

  <!-- ÍCONO CENTRAL — símbolo Claude simplificado -->
  <text x="150" y="130" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="54" fill="#a855f7" text-anchor="middle" opacity="0.9">✦</text>

  <!-- TÍTULO PRINCIPAL -->
  <text x="150" y="178" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="38" fill="white" text-anchor="middle" letter-spacing="-1">CLAUDE</text>
  <text x="150" y="210" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="26" fill="#a855f7" text-anchor="middle" letter-spacing="6">SISTEMA</text>

  <!-- DIVISOR -->
  <line x1="80" y1="228" x2="220" y2="228" stroke="#7b00d4" stroke-width="0.5" opacity="0.7"/>

  <!-- SUBTÍTULO -->
  <text x="150" y="252" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="400" font-size="9.5" fill="#c4b5fd" text-anchor="middle" letter-spacing="0.5">Domina los tres pilares</text>
  <text x="150" y="267" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="400" font-size="9.5" fill="#c4b5fd" text-anchor="middle" letter-spacing="0.5">de la IA más poderosa</text>

  <!-- TRES PILARES -->
  <text x="60" y="312" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="8" fill="#a855f7" text-anchor="middle" letter-spacing="1.5">CHAT</text>
  <text x="150" y="312" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="8" fill="#a855f7" text-anchor="middle" letter-spacing="1.5">CO-WORK</text>
  <text x="240" y="312" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="8" fill="#a855f7" text-anchor="middle" letter-spacing="1.5">CODE</text>

  <!-- PUNTOS ENTRE PILARES -->
  <circle cx="105" cy="308" r="1.5" fill="#7b00d4"/>
  <circle cx="195" cy="308" r="1.5" fill="#7b00d4"/>

  <!-- NIVEL -->
  <text x="150" y="360" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="600" font-size="8" fill="#6b21a8" text-anchor="middle" letter-spacing="2">NIVEL INTERMEDIO–AVANZADO</text>

  <!-- GLIFO DECORATIVO FONDO -->
  <text x="150" y="390" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="140" fill="#7b00d4" text-anchor="middle" opacity="0.04">AI</text>
</svg>
